<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="disc" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#1c2a1f"/>
      <stop offset="1" stop-color="#070b08"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8f25a"/>
      <stop offset="0.5" stop-color="#5fd22c"/>
      <stop offset="1" stop-color="#139a1b"/>
    </linearGradient>
    <linearGradient id="anvil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fbef"/>
      <stop offset="1" stop-color="#b9c9b5"/>
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#d8ff8a"/>
      <stop offset="1" stop-color="#5fd22c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- the disc -->
  <circle cx="256" cy="256" r="236" fill="url(#disc)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#2c3f2f" stroke-width="4"/>

  <!-- a ring of light in four quadrants, the gaps at the cardinal points -->
  <g fill="none" stroke="url(#ring)" stroke-width="30" stroke-linecap="round" filter="url(#glow)">
    <path d="M 270.0 59.5 A 197 197 0 0 1 452.5 242.0"/>
    <path d="M 452.5 270.0 A 197 197 0 0 1 270.0 452.5"/>
    <path d="M 242.0 452.5 A 197 197 0 0 1 59.5 270.0"/>
    <path d="M 59.5 242.0 A 197 197 0 0 1 242.0 59.5"/>
  </g>

  <!-- the spark struck from the anvil -->
  <circle cx="256" cy="186" r="62" fill="url(#spark)"/>
  <path d="M256 128 L266 176 L314 186 L266 196 L256 244 L246 196 L198 186 L246 176 Z" fill="#f2ffd6" filter="url(#glow)"/>
  <path d="M206 140 l4 14 l14 4 l-14 4 l-4 14 l-4 -14 l-14 -4 l14 -4 z" fill="#c9f77a"/>
  <path d="M312 226 l3 10 l10 3 l-10 3 l-3 10 l-3 -10 l-10 -3 l10 -3 z" fill="#c9f77a"/>

  <!-- the anvil -->
  <path fill="url(#anvil)" d="
    M 122 262
    L 372 262
    L 372 296
    L 336 296
    Q 312 302 306 324
    L 306 344
    L 334 344
    L 342 372
    L 170 372
    L 178 344
    L 206 344
    L 206 324
    Q 200 302 176 296
    L 196 296
    Q 150 296 122 262 Z"/>
  <path d="M 372 262 L 372 296" stroke="#8fa38b" stroke-width="2"/>
</svg>
